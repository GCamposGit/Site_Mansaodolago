<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Relatório SEO semanal {{current_start}} a {{current_end}}</title>
</head>
<body style="margin:0;padding:24px;background:#f4f1ea;color:#1c1915;font-family:Georgia,serif;">
  <article style="max-width:640px;margin:0 auto;background:#fffdf8;border:1px solid #e4dccb;padding:28px;">
    <p style="margin:0 0 8px;letter-spacing:0.04em;text-transform:uppercase;font-size:12px;color:#6d6457;">Search Console</p>
    <h1 style="margin:0 0 12px;font-size:24px;line-height:1.3;">Relatório SEO semanal</h1>
    <p style="margin:0 0 8px;">Semana atual: {{current_start}} a {{current_end}} (America/Sao_Paulo)</p>
    <p style="margin:0 0 20px;">Semana anterior: {{previous_start}} a {{previous_end}}</p>
    <table style="width:100%;border-collapse:collapse;font-size:15px;">
      <thead>
        <tr>
          <th align="left" style="border-bottom:1px solid #e4dccb;padding:8px 6px;">Métrica</th>
          <th align="right" style="border-bottom:1px solid #e4dccb;padding:8px 6px;">Atual</th>
          <th align="right" style="border-bottom:1px solid #e4dccb;padding:8px 6px;">Anterior</th>
          <th align="right" style="border-bottom:1px solid #e4dccb;padding:8px 6px;">Delta</th>
          <th align="left" style="border-bottom:1px solid #e4dccb;padding:8px 6px;">Leitura</th>
        </tr>
      </thead>
      <tbody>
        {{metric_rows}}
      </tbody>
    </table>
    <h2 style="margin:28px 0 8px;font-size:18px;">Ações recomendadas</h2>
    {{actions_html}}
  </article>
</body>
</html>
