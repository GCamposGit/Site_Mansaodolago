<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
 <meta name="referrer" content="strict-origin-when-cross-origin">
 <meta name="robots" content="noindex, nofollow">
 <title>Video</title>
 <style>
 html, body {
 margin: 0;
 padding: 0;
 width: 100%;
 height: 100%;
 background: #000;
 overflow: hidden;
 }
 iframe {
 position: absolute;
 inset: 0;
 width: 100%;
 height: 100%;
 border: 0;
 }
 </style>
 <link rel="preload" href="fonts/font-1.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>
 <script>
 (function () {
 var params = new URLSearchParams(window.location.search);
 var id = params.get("v") || "";
 // YouTube IDs are 11 chars; allow 6–20 for short/variant ids
 if (!/^[A-Za-z0-9_-]{6,20}$/.test(id)) {
 document.body.innerHTML =
 '<p style="color:#fff;font-family:system-ui;padding:1rem">Invalid video.</p>';
 return;
 }
 var iframe = document.createElement("iframe");
 // Same-origin relay so YouTube gets a real HTTPS referrer (avoids Error 153)
 iframe.src =
 "https://www.youtube-nocookie.com/embed/" +
 encodeURIComponent(id) +
 "?autoplay=1&rel=0&modestbranding=1&playsinline=1";
 iframe.allow =
 "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
 iframe.setAttribute("allowfullscreen", "");
 iframe.setAttribute("referrerpolicy", "strict-origin-when-cross-origin");
 iframe.title = "YouTube video";
 document.body.appendChild(iframe);
 })();
 </script>
</body>
</html>
