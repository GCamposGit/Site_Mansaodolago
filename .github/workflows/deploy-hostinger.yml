# Deploy the public site to Hostinger over FTPS on every push to master.
# Secrets (Settings → Secrets and variables → Actions):
#   FTP_SERVER    — hostname or IP from hPanel → Files → FTP Accounts
#   FTP_USERNAME  — FTP user
#   FTP_PASSWORD  — FTP password
# Optional repo variable:
#   FTP_SERVER_DIR — remote folder, must end with /. Default: ./
#   This FTP account already opens inside public_html (the live site).
name: Deploy site to Hostinger

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      dry_run:
        description: List file changes only (do not upload)
        type: boolean
        default: false

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: FTPS → public_html
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check FTP secrets exist
        env:
          HAS_SERVER: ${{ secrets.FTP_SERVER != '' }}
          HAS_USER: ${{ secrets.FTP_USERNAME != '' }}
          HAS_PASS: ${{ secrets.FTP_PASSWORD != '' }}
        run: |
          echo "FTP_SERVER set: $HAS_SERVER"
          echo "FTP_USERNAME set: $HAS_USER"
          echo "FTP_PASSWORD set: $HAS_PASS"
          echo "Remote dir: ./ (FTP user is already inside public_html)"
          if [ "$HAS_SERVER" != "true" ] || [ "$HAS_USER" != "true" ] || [ "$HAS_PASS" != "true" ]; then
            echo "::error::A secret is missing or named differently. Required names: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD"
            exit 1
          fi

      - name: Hub lists every published post
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          data = Path("js/blog-data.js").read_text(encoding="utf-8")
          hub = Path("blog/index.html").read_text(encoding="utf-8")
          slugs = re.findall(r'slug:\s*"([^"]+)"', data)
          if not slugs:
              raise SystemExit("js/blog-data.js has no slugs")
          missing = [s for s in slugs if f"{s}.html" not in hub]
          if missing:
              raise SystemExit(
                  "blog/index.html is missing static cards for: " + ", ".join(missing)
              )
          print("Hub lists", len(slugs), "posts:", ", ".join(slugs))
          PY

      - name: Write deploy marker
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          printf '%s\n' "${GITHUB_SHA}" > blog/deploy-marker.txt
          mkdir -p .ftp-blog-js
          cp js/blog-data.js js/blog.js .ftp-blog-js/

      - name: Force blog HTML → ./blog/
        if: ${{ always() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: loose
          timeout: 180000
          local-dir: ./blog/
          server-dir: ./blog/
          state-name: .ftp-deploy-sync-state-blog.json
          exclude: |
            **/*.md

      - name: Force blog JS → ./js/
        if: ${{ always() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: loose
          timeout: 180000
          local-dir: ./.ftp-blog-js/
          server-dir: ./js/
          state-name: .ftp-deploy-sync-state-blog-js.json

      - name: Check live hub
        id: livehub
        if: ${{ always() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        continue-on-error: true
        run: |
          set -euo pipefail
          SLUG=$(python3 -c "import re,pathlib; print(re.findall('slug: \"(.+?)\"', pathlib.Path('js/blog-data.js').read_text())[0])")
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          sleep 6
          echo "GET /blog/deploy-marker.txt"
          curl -fsS --max-time 30 -H "Cache-Control: no-cache" \
            "https://www.mansaodolago.com/blog/deploy-marker.txt" | grep -F "${GITHUB_SHA}"
          echo "GET /blog/"
          curl -fsS --max-time 30 -H "Cache-Control: no-cache" \
            "https://www.mansaodolago.com/blog/" | grep -F "$SLUG"

      - name: Force blog HTML → ./public_html/blog/
        if: ${{ always() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) && steps.livehub.outcome == 'failure' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: loose
          timeout: 180000
          local-dir: ./blog/
          server-dir: ./public_html/blog/
          state-name: .ftp-deploy-sync-state-blog-public-html.json
          exclude: |
            **/*.md

      - name: Force blog JS → ./public_html/js/
        if: ${{ always() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) && steps.livehub.outcome == 'failure' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: loose
          timeout: 180000
          local-dir: ./.ftp-blog-js/
          server-dir: ./public_html/js/
          state-name: .ftp-deploy-sync-state-blog-js-public-html.json

      - name: Prove public hub lists the newest post
        if: ${{ always() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          set -euo pipefail
          SLUG=$(python3 -c "import re,pathlib; print(re.findall('slug: \"(.+?)\"', pathlib.Path('js/blog-data.js').read_text())[0])")
          sleep 6
          echo "GET /blog/"
          curl -fsS --max-time 30 -H "Cache-Control: no-cache" \
            "https://www.mansaodolago.com/blog/" | grep -F "$SLUG"
          echo "Live hub contains $SLUG"

      - name: Upload rest of site
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: loose
          timeout: 180000
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.gitignore
            **/.gitattributes
            **/.grok/**
            **/node_modules/**
            README.md
            ARCHITECTURE.md
            SECURITY.md
            **/p/**
            **/p/**/**
            api/config.php
            js/private-guest-i18n.js
            js/private-events-i18n.js
            **/02-docs/**
            **/scripts/**
            **/03-scripts/**
            **/01-assets/**
            **/0. Backup*/**
            videos/youtube-clips/**
            videos/hero-lago-loop-preview.mp4
            videos/hero-lago-loop-preview-v2.mp4
            videos/hero-lago-loop-preview-v3.mp4
            videos/hero-lago-loop-preview-v4.mp4
            videos/hero-lago-source-crop-right.jpg
            videos/hero-lago-source-mild-crop.jpg
            **/*.md
            **/*.bak
            **/__pycache__/**
