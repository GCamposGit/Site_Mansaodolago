# Deploy the public site to Hostinger over FTPS on every push to master.
# Secrets (Settings → Secrets and variables → Actions):
#   FTP_SERVER    — hostname from hPanel → Files → FTP Accounts (not the website URL)
#   FTP_USERNAME  — FTP user
#   FTP_PASSWORD  — FTP password
# Optional repo variable (not secret):
#   FTP_SERVER_DIR — remote folder, must end with /.
#   Hostinger websites usually live at domains/<domain>/public_html/
#   Use ./ only if this FTP user already opens inside that folder.
name: Deploy site to Hostinger

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      dry_run:
        description: List file changes only (do not upload)
        type: boolean
        default: false

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: FTPS → Hostinger web root
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check FTP secrets exist
        env:
          HAS_SERVER: ${{ secrets.FTP_SERVER != '' }}
          HAS_USER: ${{ secrets.FTP_USERNAME != '' }}
          HAS_PASS: ${{ secrets.FTP_PASSWORD != '' }}
        run: |
          echo "FTP_SERVER set: $HAS_SERVER"
          echo "FTP_USERNAME set: $HAS_USER"
          echo "FTP_PASSWORD set: $HAS_PASS"
          echo "Remote dir: domains/mansaodolago.com/public_html/ (or vars.FTP_SERVER_DIR)"
          if [ "$HAS_SERVER" != "true" ] || [ "$HAS_USER" != "true" ] || [ "$HAS_PASS" != "true" ]; then
            echo "::error::A secret is missing or named differently. Required names: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD"
            exit 1
          fi

      - name: Probe FTP landing folders
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          printf 'mdl-probe %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > /tmp/mdl-probe.txt
          lftp -c "
            set ssl:verify-certificate no
            set ftp:ssl-force true
            open -u ${FTP_USER},${FTP_PASS} ftps://${FTP_HOST}
            pwd
            ls
            put /tmp/mdl-probe.txt -o mdl-probe-dot.txt
            put /tmp/mdl-probe.txt -o public_html/mdl-probe-pub.txt || true
            put /tmp/mdl-probe.txt -o domains/mansaodolago.com/public_html/mdl-probe-domains.txt || true
          "

      - name: Upload to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: loose
          timeout: 120000
          server-dir: ${{ vars.FTP_SERVER_DIR || 'domains/mansaodolago.com/public_html/' }}
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.gitignore
            **/.gitattributes
            **/.grok/**
            **/node_modules/**
            README.md
            ARCHITECTURE.md
            SECURITY.md
            **/p/**
            **/p/**/**
            api/config.php
            js/private-guest-i18n.js
            js/private-events-i18n.js
            **/02-docs/**
            **/scripts/**
            **/03-scripts/**
            **/01-assets/**
            **/0. Backup*/**
            videos/youtube-clips/**
            videos/hero-lago-loop-preview.mp4
            videos/hero-lago-loop-preview-v2.mp4
            videos/hero-lago-loop-preview-v3.mp4
            videos/hero-lago-loop-preview-v4.mp4
            videos/hero-lago-source-crop-right.jpg
            videos/hero-lago-source-mild-crop.jpg
            **/*.md
            **/*.bak
            **/__pycache__/**
